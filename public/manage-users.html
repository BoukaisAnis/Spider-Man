<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man | Manage Users</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="https://i.pinimg.com/1200x/bc/ae/a4/bcaea48932509f7d4813b0d3636cee7d.jpg">
    
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: white;
            min-height: 100vh;
        }
        .hero-title {
            font-family: 'Orbitron', sans-serif;
        }
        .admin-card {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 9, 20, 0.3);
        }
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(229, 9, 20, 0.1);
        }
        th {
            background: rgba(229, 9, 20, 0.1);
            font-weight: bold;
        }
        tr:hover {
            background: rgba(229, 9, 20, 0.05);
        }
        .btn-toggle {
            background: #3b82f6;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            color: white;
        }
        .btn-toggle:hover {
            background: #2563eb;
        }
        .btn-delete {
            background: #ef4444;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            color: white;
        }
        .btn-delete:hover {
            background: #dc2626;
        }
        .role-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 600;
        }
        .role-admin {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.5);
        }
        .role-user {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Navigation -->
    <nav class="bg-gray-800 border-b border-gray-700 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="https://i.pinimg.com/1200x/bc/ae/a4/bcaea48932509f7d4813b0d3636cee7d.jpg" 
                     alt="Spider-Man" class="w-10 h-10 rounded-full border-2 border-red-600">
                <span class="hero-title text-xl font-bold">Spider-Admin</span>
            </div>
            <div class="flex items-center space-x-4">
                <a href="/admin-dashboard.html" class="hover:text-red-500 transition-colors">
                    <i class="fas fa-home mr-2"></i>Dashboard
                </a>
                <a href="/manage-products.html" class="hover:text-red-500 transition-colors">
                    <i class="fas fa-box mr-2"></i>Products
                </a>
                <a href="/manage-users.html" class="text-red-500">
                    <i class="fas fa-users mr-2"></i>Users
                </a>
                <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded transition-colors">
                    <i class="fas fa-sign-out-alt mr-2"></i>Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold hero-title mb-8">
            <span class="text-red-500">MANAGE</span> USERS
        </h1>

        <!-- Users Table -->
        <div class="admin-card rounded-lg p-6">
            <div id="loadingState" class="text-center py-12">
                <i class="fas fa-spinner fa-spin text-3xl text-red-600 mb-4"></i>
                <p class="text-gray-400">Loading users...</p>
            </div>

            <div id="usersTable" class="table-container hidden">
                <table>
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Joined</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersList">
                    </tbody>
                </table>
            </div>

            <div id="emptyState" class="text-center py-12 hidden">
                <i class="fas fa-inbox text-4xl text-gray-600 mb-4"></i>
                <h3 class="text-xl font-bold text-gray-400 mb-2">No users found</h3>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = '/api/v1';
        let allUsers = [];

        // Check authentication
        function checkAuth() {
            const user = localStorage.getItem('user');
            const token = localStorage.getItem('token');
            
            if (!user || !token) {
                window.location.href = '/';
                return null;
            }
            
            try {
                const userData = JSON.parse(user);
                if (userData.role !== 'admin') {
                    window.location.href = '/dashboard.html';
                    return null;
                }
                return { userData, token };
            } catch (error) {
                logout();
                return null;
            }
        }

        // Load users
        async function loadUsers() {
            const auth = checkAuth();
            if (!auth) return;

            try {
                const response = await fetch(`${API_BASE_URL}/user/all`, {
                    headers: {
                        'x-auth-token': auth.token
                    }
                });

                const data = await response.json();
                
                if (data.success) {
                    allUsers = data.data || [];
                    displayUsers();
                } else {
                    showNotification('Error: ' + data.message, 'error');
                }
            } catch (error) {
                console.error('Error loading users:', error);
                showNotification('Error loading users', 'error');
            }
        }

        // Display users in table
        function displayUsers() {
            const loadingState = document.getElementById('loadingState');
            const usersTable = document.getElementById('usersTable');
            const emptyState = document.getElementById('emptyState');
            const usersList = document.getElementById('usersList');

            loadingState.classList.add('hidden');

            if (allUsers.length === 0) {
                usersTable.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            usersTable.classList.remove('hidden');

            usersList.innerHTML = allUsers.map(user => `
                <tr>
                    <td class="font-semibold">${user.username}</td>
                    <td>${user.email}</td>
                    <td>
                        <span class="role-badge role-${user.role}">
                            ${user.role === 'admin' ? '👑 Admin' : '👤 User'}
                        </span>
                    </td>
                    <td class="text-sm text-gray-400">
                        ${new Date(user.createdAt).toLocaleDateString()}
                    </td>
                    <td>
                        <button onclick="toggleRole('${user._id}', '${user.role}')" class="btn-toggle mr-2">
                            <i class="fas fa-exchange-alt mr-1"></i>
                            ${user.role === 'admin' ? 'Make User' : 'Make Admin'}
                        </button>
                        <button onclick="deleteUser('${user._id}')" class="btn-delete">
                            <i class="fas fa-trash mr-1"></i>Delete
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Toggle user role
        async function toggleRole(userId, currentRole) {
            if (!confirm(`Change user role from ${currentRole} to ${currentRole === 'admin' ? 'user' : 'admin'}?`)) return;

            const auth = checkAuth();
            if (!auth) return;

            try {
                const response = await fetch(`${API_BASE_URL}/user/${userId}/role`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-auth-token': auth.token
                    }
                });

                const data = await response.json();
                
                if (data.success) {
                    showNotification('User role updated successfully', 'success');
                    loadUsers();
                } else {
                    showNotification('Error: ' + data.message, 'error');
                }
            } catch (error) {
                console.error('Error updating role:', error);
                showNotification('Error updating user role', 'error');
            }
        }

        // Delete user
        async function deleteUser(userId) {
            if (!confirm('Are you sure you want to delete this user? This action cannot be undone.')) return;

            const auth = checkAuth();
            if (!auth) return;

            try {
                const response = await fetch(`${API_BASE_URL}/user/${userId}`, {
                    method: 'DELETE',
                    headers: {
                        'x-auth-token': auth.token
                    }
                });

                const data = await response.json();
                
                if (data.success) {
                    showNotification('User deleted successfully', 'success');
                    loadUsers();
                } else {
                    showNotification('Error: ' + data.message, 'error');
                }
            } catch (error) {
                console.error('Error deleting user:', error);
                showNotification('Error deleting user', 'error');
            }
        }

        // Logout
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('user');
                localStorage.removeItem('token');
                window.location.href = '/';
            }
        }

        // Show notification
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-green-600' : 'bg-blue-600';
            
            notification.className = `fixed top-4 right-4 ${bgColor} text-white px-6 py-3 rounded-lg shadow-lg z-50`;
            notification.innerHTML = `
                <div class="flex items-center space-x-2">
                    <i class="fas fa-${type === 'error' ? 'exclamation-circle' : type === 'success' ? 'check-circle' : 'info-circle'}"></i>
                    <span>${message}</span>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadUsers();
        });
    </script>
</body>
</html>
