<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spider-Man | Manage Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="https://i.pinimg.com/1200x/bc/ae/a4/bcaea48932509f7d4813b0d3636cee7d.jpg"
    />

    <style>
      body {
        font-family: "Roboto", sans-serif;
        background: linear-gradient(
          135deg,
          #0a0a0a 0%,
          #1a1a2e 50%,
          #16213e 100%
        );
        color: white;
        min-height: 100vh;
      }
      .hero-title {
        font-family: "Orbitron", sans-serif;
      }
      .admin-card {
        background: rgba(20, 20, 20, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(229, 9, 20, 0.3);
      }
      .table-container {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 1rem;
        text-align: left;
        border-bottom: 1px solid rgba(229, 9, 20, 0.1);
      }
      th {
        background: rgba(229, 9, 20, 0.1);
        font-weight: bold;
      }
      tr:hover {
        background: rgba(229, 9, 20, 0.05);
      }
      .btn-edit {
        background: #3b82f6;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        cursor: pointer;
        transition: all 0.3s;
        border: none;
        color: white;
      }
      .btn-edit:hover {
        background: #2563eb;
      }
      .btn-delete {
        background: #ef4444;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        cursor: pointer;
        transition: all 0.3s;
        border: none;
        color: white;
      }
      .btn-delete:hover {
        background: #dc2626;
      }
      .btn-primary {
        background: #e50914;
        transition: all 0.3s ease;
      }
      .btn-primary:hover {
        background: #c20812;
      }
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 1000;
        align-items: center;
        justify-content: center;
      }
      .modal.active {
        display: flex;
      }
      .modal-content {
        background: rgba(20, 20, 20, 0.95);
        border: 1px solid rgba(229, 9, 20, 0.3);
        border-radius: 0.5rem;
        padding: 2rem;
        max-width: 600px;
        width: 90%;
        max-height: 90vh;
        overflow-y: auto;
      }
      .form-input {
        background: rgba(30, 30, 30, 0.9);
        border: 1px solid rgba(229, 9, 20, 0.2);
        color: white;
        padding: 0.5rem;
        border-radius: 0.375rem;
        width: 100%;
        margin-bottom: 1rem;
      }
      .form-input:focus {
        border-color: #e50914;
        outline: none;
      }
    </style>
  </head>
  <body class="min-h-screen">
    <!-- Navigation -->
    <nav class="bg-gray-800 border-b border-gray-700 p-4">
      <div class="container mx-auto flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <img
            src="https://i.pinimg.com/1200x/bc/ae/a4/bcaea48932509f7d4813b0d3636cee7d.jpg"
            alt="Spider-Man"
            class="w-10 h-10 rounded-full border-2 border-red-600"
          />
          <span class="hero-title text-xl font-bold">Spider-Admin</span>
        </div>
        <div class="flex items-center space-x-4">
          <a
            href="/admin-dashboard.html"
            class="hover:text-red-500 transition-colors"
          >
            <i class="fas fa-home mr-2"></i>Dashboard
          </a>
          <a href="/manage-products.html" class="text-red-500">
            <i class="fas fa-box mr-2"></i>Products
          </a>
          <a
            href="/manage-users.html"
            class="hover:text-red-500 transition-colors"
          >
            <i class="fas fa-users mr-2"></i>Users
          </a>
          <button
            onclick="logout()"
            class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded transition-colors"
          >
            <i class="fas fa-sign-out-alt mr-2"></i>Logout
          </button>
        </div>
      </div>
    </nav>

    <!-- Content -->
    <div class="container mx-auto px-4 py-8">
      <div class="flex justify-between items-center mb-8">
        <h1 class="text-4xl font-bold hero-title">
          <span class="text-red-500">MANAGE</span> PRODUCTS
        </h1>
        <button
          onclick="openAddProductModal()"
          class="btn-primary text-white px-6 py-3 rounded-lg font-bold"
        >
          <i class="fas fa-plus mr-2"></i>Add New Product
        </button>
      </div>

      <!-- Products Table -->
      <div class="admin-card rounded-lg p-6">
        <div id="loadingState" class="text-center py-12">
          <i class="fas fa-spinner fa-spin text-3xl text-red-600 mb-4"></i>
          <p class="text-gray-400">Loading products...</p>
        </div>

        <div id="productsTable" class="table-container hidden">
          <table>
            <thead>
              <tr>
                <th>Product Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="productsList"></tbody>
          </table>
        </div>

        <div id="emptyState" class="text-center py-12 hidden">
          <i class="fas fa-inbox text-4xl text-gray-600 mb-4"></i>
          <h3 class="text-xl font-bold text-gray-400 mb-2">
            No products found
          </h3>
          <p class="text-gray-500">Start by adding your first product!</p>
        </div>
      </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div id="productModal" class="modal">
      <div class="modal-content">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-2xl font-bold" id="modalTitle">Add Product</h2>
          <button
            onclick="closeProductModal()"
            class="text-gray-400 hover:text-white"
          >
            <i class="fas fa-times text-2xl"></i>
          </button>
        </div>

        <form id="productForm" class="space-y-4">
          <div>
            <label class="block text-sm font-semibold mb-2">Product Name</label>
            <input
              type="text"
              id="prodName"
              class="form-input"
              placeholder="Product name"
              required
            />
          </div>

          <div>
            <label class="block text-sm font-semibold mb-2">Description</label>
            <textarea
              id="prodDescription"
              class="form-input"
              placeholder="Product description"
              rows="3"
              required
            ></textarea>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold mb-2">Price</label>
              <input
                type="number"
                id="prodPrice"
                class="form-input"
                placeholder="0.00"
                step="0.01"
                required
              />
            </div>
            <div>
              <label class="block text-sm font-semibold mb-2">Stock</label>
              <input
                type="number"
                id="prodStock"
                class="form-input"
                placeholder="0"
                min="0"
                required
              />
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold mb-2">Category</label>
            <select id="prodCategory" class="form-input" required>
              <option value="">Select Category</option>
              <option value="electronics">Electronics</option>
              <option value="clothing">Clothing</option>
              <option value="toys">Toys</option>
              <option value="home">Home</option>
              <option value="sports">Sports</option>
              <option value="books">Books</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-semibold mb-2">Image URL</label>
            <input
              type="url"
              id="prodImage"
              class="form-input"
              placeholder="https://example.com/image.jpg"
            />
          </div>

          <div class="flex space-x-4 pt-4">
            <button
              type="submit"
              class="btn-primary text-white px-6 py-2 rounded-lg font-bold flex-1"
            >
              <i class="fas fa-save mr-2"></i>Save Product
            </button>
            <button
              type="button"
              onclick="closeProductModal()"
              class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-2 rounded-lg font-bold flex-1"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const API_BASE_URL = "/api/v1";
      let allProducts = [];
      let editingProductId = null;

      // Check authentication
      function checkAuth() {
        const user = localStorage.getItem("user");
        const token = localStorage.getItem("token");

        if (!user || !token) {
          window.location.href = "/";
          return null;
        }

        try {
          const userData = JSON.parse(user);
          // Allow page to load, but show message if not admin
          if (userData.role !== "admin") {
            showNotification("Admin access required", "error");
            setTimeout(() => {
              window.location.href = "/dashboard.html";
            }, 2000);
            return null;
          }
          return { userData, token };
        } catch (error) {
          logout();
          return null;
        }
      }

      // Load products
      async function loadProducts() {
        const auth = checkAuth();
        if (!auth) return;

        try {
          const response = await fetch(`${API_BASE_URL}/products`, {
            headers: {
              "x-auth-token": auth.token,
            },
          });

          const data = await response.json();

          if (data.success) {
            allProducts = data.products || [];
            displayProducts();
          }
        } catch (error) {
          console.error("Error loading products:", error);
          showNotification("Error loading products", "error");
        }
      }

      // Display products in table
      function displayProducts() {
        const loadingState = document.getElementById("loadingState");
        const productsTable = document.getElementById("productsTable");
        const emptyState = document.getElementById("emptyState");
        const productsList = document.getElementById("productsList");

        loadingState.classList.add("hidden");

        if (allProducts.length === 0) {
          productsTable.classList.add("hidden");
          emptyState.classList.remove("hidden");
          return;
        }

        emptyState.classList.add("hidden");
        productsTable.classList.remove("hidden");

        productsList.innerHTML = allProducts
          .map(
            (product) => `
                <tr>
                    <td class="font-semibold">${product.name}</td>
                    <td><span class="bg-gray-700 px-2 py-1 rounded text-xs">${
                      product.category
                    }</span></td>
                    <td class="text-red-500 font-bold">$${product.price.toFixed(
                      2
                    )}</td>
                    <td>${product.stock}</td>
                    <td>
                        ${
                          product.stock > 0
                            ? '<span class="text-green-500">In Stock</span>'
                            : '<span class="text-red-500">Out of Stock</span>'
                        }
                    </td>
                    <td>
                        <button onclick="editProduct('${
                          product._id
                        }')" class="btn-edit mr-2">
                            <i class="fas fa-edit mr-1"></i>Edit
                        </button>
                        <button onclick="deleteProduct('${
                          product._id
                        }')" class="btn-delete">
                            <i class="fas fa-trash mr-1"></i>Delete
                        </button>
                    </td>
                </tr>
            `
          )
          .join("");
      }

      // Open add product modal
      function openAddProductModal() {
        editingProductId = null;
        document.getElementById("modalTitle").textContent = "Add Product";
        document.getElementById("productForm").reset();
        document.getElementById("productModal").classList.add("active");
      }

      // Edit product
      function editProduct(productId) {
        const product = allProducts.find((p) => p._id === productId);
        if (!product) return;

        editingProductId = productId;
        document.getElementById("modalTitle").textContent = "Edit Product";
        document.getElementById("prodName").value = product.name;
        document.getElementById("prodDescription").value = product.description;
        document.getElementById("prodPrice").value = product.price;
        document.getElementById("prodStock").value = product.stock;
        document.getElementById("prodCategory").value = product.category;
        document.getElementById("prodImage").value = product.image;

        document.getElementById("productModal").classList.add("active");
      }

      // Close product modal
      function closeProductModal() {
        document.getElementById("productModal").classList.remove("active");
        editingProductId = null;
      }

      // Save product
      document
        .getElementById("productForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const auth = checkAuth();
          if (!auth) return;

          const productData = {
            name: document.getElementById("prodName").value,
            description: document.getElementById("prodDescription").value,
            price: parseFloat(document.getElementById("prodPrice").value),
            stock: parseInt(document.getElementById("prodStock").value),
            category: document.getElementById("prodCategory").value,
            image: document.getElementById("prodImage").value || undefined,
          };

          try {
            const url = editingProductId
              ? `${API_BASE_URL}/products/${editingProductId}`
              : `${API_BASE_URL}/products`;

            const method = editingProductId ? "PUT" : "POST";

            const response = await fetch(url, {
              method,
              headers: {
                "Content-Type": "application/json",
                "x-auth-token": auth.token,
              },
              body: JSON.stringify(productData),
            });

            const data = await response.json();

            if (data.success) {
              showNotification(
                editingProductId
                  ? "Product updated successfully"
                  : "Product added successfully",
                "success"
              );
              closeProductModal();
              loadProducts();
            } else {
              showNotification("Error: " + data.message, "error");
            }
          } catch (error) {
            console.error("Error saving product:", error);
            showNotification("Error saving product", "error");
          }
        });

      // Delete product
      async function deleteProduct(productId) {
        if (!confirm("Are you sure you want to delete this product?")) return;

        const auth = checkAuth();
        if (!auth) return;

        try {
          const response = await fetch(
            `${API_BASE_URL}/products/${productId}`,
            {
              method: "DELETE",
              headers: {
                "x-auth-token": auth.token,
              },
            }
          );

          const data = await response.json();

          if (data.success) {
            showNotification("Product deleted successfully", "success");
            loadProducts();
          } else {
            showNotification("Error: " + data.message, "error");
          }
        } catch (error) {
          console.error("Error deleting product:", error);
          showNotification("Error deleting product", "error");
        }
      }

      // Logout
      function logout() {
        if (confirm("Are you sure you want to logout?")) {
          localStorage.removeItem("user");
          localStorage.removeItem("token");
          window.location.href = "/";
        }
      }

      // Show notification
      function showNotification(message, type = "info") {
        const notification = document.createElement("div");
        const bgColor =
          type === "error"
            ? "bg-red-600"
            : type === "success"
            ? "bg-green-600"
            : "bg-blue-600";

        notification.className = `fixed top-4 right-4 ${bgColor} text-white px-6 py-3 rounded-lg shadow-lg z-50`;
        notification.innerHTML = `
                <div class="flex items-center space-x-2">
                    <i class="fas fa-${
                      type === "error"
                        ? "exclamation-circle"
                        : type === "success"
                        ? "check-circle"
                        : "info-circle"
                    }"></i>
                    <span>${message}</span>
                </div>
            `;

        document.body.appendChild(notification);

        setTimeout(() => {
          notification.remove();
        }, 3000);
      }

      // Close modal when clicking outside
      window.onclick = function (event) {
        const modal = document.getElementById("productModal");
        if (event.target === modal) {
          modal.classList.remove("active");
        }
      };

      // Initialize
      document.addEventListener("DOMContentLoaded", function () {
        loadProducts();
      });
    </script>
  </body>
</html>
