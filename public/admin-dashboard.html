<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="https://i.pinimg.com/1200x/bc/ae/a4/bcaea48932509f7d4813b0d3636cee7d.jpg">
    
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #0a0a0a;
            color: #fff;
        }
        .hero-title {
            font-family: 'Orbitron', sans-serif;
        }
        .spidey-glow {
            box-shadow: 0 0 30px rgba(229, 9, 20, 0.6);
        }
        .text-glow {
            text-shadow: 0 0 10px rgba(229, 9, 20, 0.7);
        }
        .web-background {
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(229, 9, 20, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(229, 9, 20, 0.1) 0%, transparent 50%);
            background-size: 400px 400px;
        }
        .admin-card {
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 9, 20, 0.3);
        }
        .user-row:hover {
            background: rgba(229, 9, 20, 0.1);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
        }
        .modal-content {
            background: rgba(30, 30, 30, 0.95);
            border: 2px solid #e50914;
        }
    </style>
</head>
<body class="web-background min-h-screen">
    <!-- Navigation -->
    <nav class="flex justify-between items-center p-6 border-b border-gray-800">
        <div class="flex items-center space-x-3">
            <img src="https://i.pinimg.com/1200x/bc/ae/a4/bcaea48932509f7d4813b0d3636cee7d.jpg" 
                 alt="Spider-Man Icon" 
                 class="w-10 h-10 rounded-full border-2 border-red-600">
            <div>
                <span class="hero-title text-xl font-bold">SPIDER-ADMIN</span>
                <p class="text-xs text-red-500">Administrator Control Panel</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <span id="admin-welcome" class="text-gray-300">Welcome, Admin!</span>
            <button onclick="switchToUserDashboard()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg transition-colors">
                User View
            </button>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg transition-colors">
                Logout
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto px-6 py-8">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="hero-title text-4xl font-bold text-center mb-2">
                <span class="text-red-600 text-glow">ADMIN CONTROL CENTER</span>
            </h1>
            <p class="text-gray-400 text-center">Manage your Spider-Verse heroes and maintain order!</p>
        </div>

        <!-- Quick Stats -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="admin-card p-6 rounded-xl">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 bg-red-600 rounded-lg flex items-center justify-center">
                        <i class="fas fa-users text-white text-xl"></i>
                    </div>
                    <div>
                        <h3 class="text-2xl font-bold" id="total-users">0</h3>
                        <p class="text-gray-400">Total Users</p>
                    </div>
                </div>
            </div>
            
            <div class="admin-card p-6 rounded-xl">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 bg-green-600 rounded-lg flex items-center justify-center">
                        <i class="fas fa-user-shield text-white text-xl"></i>
                    </div>
                    <div>
                        <h3 class="text-2xl font-bold" id="admin-users">0</h3>
                        <p class="text-gray-400">Admin Users</p>
                    </div>
                </div>
            </div>
            
            <div class="admin-card p-6 rounded-xl">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 bg-blue-600 rounded-lg flex items-center justify-center">
                        <i class="fas fa-user text-white text-xl"></i>
                    </div>
                    <div>
                        <h3 class="text-2xl font-bold" id="regular-users">0</h3>
                        <p class="text-gray-400">Regular Users</p>
                    </div>
                </div>
            </div>
            
            <div class="admin-card p-6 rounded-xl">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 bg-purple-600 rounded-lg flex items-center justify-center">
                        <i class="fas fa-calendar-day text-white text-xl"></i>
                    </div>
                    <div>
                        <h3 class="text-2xl font-bold" id="today-users">0</h3>
                        <p class="text-gray-400">New Today</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Bar -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="hero-title text-2xl">User Management</h2>
            <div class="flex space-x-4">
                <button onclick="showAddUserModal()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg transition-colors flex items-center space-x-2">
                    <i class="fas fa-plus"></i>
                    <span>Add User</span>
                </button>
                <button onclick="refreshUsers()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg transition-colors flex items-center space-x-2">
                    <i class="fas fa-sync-alt"></i>
                    <span>Refresh</span>
                </button>
            </div>
        </div>

        <!-- Users Table -->
        <div class="admin-card rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="bg-gray-900">
                            <th class="px-6 py-4 text-left">User</th>
                            <th class="px-6 py-4 text-left">Email</th>
                            <th class="px-6 py-4 text-left">Role</th>
                            <th class="px-6 py-4 text-left">Joined</th>
                            <th class="px-6 py-4 text-left">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <!-- Users will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading-state" class="text-center py-8">
            <i class="fas fa-spinner fa-spin text-2xl text-red-600 mb-2"></i>
            <p class="text-gray-400">Loading users...</p>
        </div>
    </div>

    <!-- Add User Modal -->
    <div id="addUserModal" class="modal">
        <div class="flex items-center justify-center min-h-screen">
            <div class="modal-content rounded-xl p-6 w-full max-w-md">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="hero-title text-xl">Add New User</h3>
                    <button onclick="closeAddUserModal()" class="text-gray-400 hover:text-white">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                
                <form id="add-user-form" class="space-y-4">
                    <div>
                        <label class="block text-gray-300 mb-2">Username</label>
                        <input type="text" id="new-username" 
                               class="w-full px-4 py-3 bg-gray-800 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-600 text-white"
                               required>
                    </div>
                    
                    <div>
                        <label class="block text-gray-300 mb-2">Email</label>
                        <input type="email" id="new-email" 
                               class="w-full px-4 py-3 bg-gray-800 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-600 text-white"
                               required>
                    </div>
                    
                    <div>
                        <label class="block text-gray-300 mb-2">Password</label>
                        <input type="password" id="new-password" 
                               class="w-full px-4 py-3 bg-gray-800 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-600 text-white"
                               required>
                    </div>
                    
                    <div>
                        <label class="block text-gray-300 mb-2">Role</label>
                        <select id="new-role" 
                                class="w-full px-4 py-3 bg-gray-800 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-600 text-white">
                            <option value="user">Regular User</option>
                            <option value="admin">Administrator</option>
                        </select>
                    </div>
                    
                    <div class="flex space-x-4 pt-4">
                        <button type="button" onclick="closeAddUserModal()" 
                                class="flex-1 bg-gray-700 hover:bg-gray-600 py-3 rounded-lg transition-colors">
                            Cancel
                        </button>
                        <button type="submit" 
                                class="flex-1 bg-red-600 hover:bg-red-700 py-3 rounded-lg transition-colors">
                            Create User
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
// UPDATED ADMIN DASHBOARD JAVASCRIPT
const API_BASE_URL = 'http://localhost:3000/api/v1';

// Check authentication and admin role
function checkAdminAuth() {
    const user = localStorage.getItem('user');
    const token = localStorage.getItem('token');
    
    console.log('🔐 Checking admin auth...', { user: !!user, token: !!token });
    
    if (!user || !token) {
        window.location.href = '/';
        return null;
    }
    
    try {
        const userData = JSON.parse(user);
        console.log('👤 User role:', userData.role);
        
        if (userData.role !== 'admin') {
            alert('❌ Admin access required!');
            window.location.href = '/dashboard.html';
            return null;
        }
        return { userData, token };
    } catch (error) {
        console.error('Error parsing user data:', error);
        logout();
        return null;
    }
}

// Load all users
async function loadUsers() {
    const auth = checkAdminAuth();
    if (!auth) return;

    showLoading(true);
    
    try {
        console.log('👥 Loading users...');
        
        const response = await fetch(`${API_BASE_URL}/user/all`, {
            headers: {
                'x-auth-token': auth.token,
                'Content-Type': 'application/json'
            }
        });

        console.log('📡 Users response status:', response.status);
        
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`HTTP ${response.status}: ${errorText}`);
        }

        const result = await response.json();
        console.log('📨 Users data:', result);
        
        // Handle different response formats
        const users = result.users || result.data || result;
        displayUsers(users);
        updateStats(users);
        
    } catch (error) {
        console.error('❌ Error loading users:', error);
        showNotification('Failed to load users: ' + error.message, 'error');
    } finally {
        showLoading(false);
    }
}

// Add new user
async function addUser(userData) {
    const auth = checkAdminAuth();
    if (!auth) return;

    try {
        console.log('➕ Adding user:', userData);
        
        const response = await fetch(`${API_BASE_URL}/auth/register`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'x-auth-token': auth.token
            },
            body: JSON.stringify(userData)
        });

        const result = await response.json();
        console.log('📨 Add user response:', result);

        if (!response.ok) {
            throw new Error(result.message || 'Failed to create user');
        }

        showNotification('User created successfully!', 'success');
        closeAddUserModal();
        loadUsers(); // Refresh the list
        
    } catch (error) {
        console.error('❌ Error creating user:', error);
        showNotification('Failed to create user: ' + error.message, 'error');
    }
}

// Promote/Demote user
async function promoteUser(userId) {
    const auth = checkAdminAuth();
    if (!auth) return;

    if (!confirm('Are you sure you want to change this user\'s role?')) {
        return;
    }

    try {
        console.log('🔄 Promoting user:', userId);
        
        const response = await fetch(`${API_BASE_URL}/user/${userId}/role`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'x-auth-token': auth.token
            }
        });

        const result = await response.json();
        console.log('📨 Promote user response:', result);

        if (!response.ok) {
            throw new Error(result.message || 'Failed to update user role');
        }

        showNotification('User role updated successfully!', 'success');
        loadUsers(); // Refresh the list
        
    } catch (error) {
        console.error('❌ Error updating user role:', error);
        showNotification('Failed to update user role: ' + error.message, 'error');
    }
}

// Delete user
async function deleteUser(userId, username) {
    const auth = checkAdminAuth();
    if (!auth) return;

    if (!confirm(`Are you sure you want to delete user "${username}"? This action cannot be undone.`)) {
        return;
    }

    try {
        console.log('🗑️ Deleting user:', userId);
        
        const response = await fetch(`${API_BASE_URL}/user/${userId}`, {
            method: 'DELETE',
            headers: {
                'x-auth-token': auth.token
            }
        });

        const result = await response.json();
        console.log('📨 Delete user response:', result);

        if (!response.ok) {
            throw new Error(result.message || 'Failed to delete user');
        }

        showNotification('User deleted successfully!', 'success');
        loadUsers(); // Refresh the list
        
    } catch (error) {
        console.error('❌ Error deleting user:', error);
        showNotification('Failed to delete user: ' + error.message, 'error');
    }
}

// Display users in table
function displayUsers(users) {
    const tbody = document.getElementById('users-table-body');
    if (!tbody) {
        console.error('❌ Users table body not found');
        return;
    }
    
    tbody.innerHTML = '';

    if (!users || users.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="5" class="px-6 py-8 text-center text-gray-400">
                    <i class="fas fa-users text-3xl mb-2"></i>
                    <p>No users found</p>
                </td>
            </tr>
        `;
        return;
    }

    users.forEach(user => {
        const row = document.createElement('tr');
        row.className = 'user-row border-b border-gray-800 hover:bg-gray-800 transition-colors';
        
        const joinDate = user.createdAt ? new Date(user.createdAt).toLocaleDateString() : 'Unknown';
        const roleBadge = user.role === 'admin' 
            ? '<span class="bg-red-600 text-white px-2 py-1 rounded text-xs font-bold">ADMIN</span>'
            : '<span class="bg-blue-600 text-white px-2 py-1 rounded text-xs">USER</span>';

        row.innerHTML = `
            <td class="px-6 py-4">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-r from-red-600 to-red-800 rounded-full flex items-center justify-center">
                        <i class="fas fa-user text-white text-sm"></i>
                    </div>
                    <div>
                        <div class="font-medium text-white">${user.username || 'Unknown'}</div>
                        <div class="text-xs text-gray-400">ID: ${user._id ? user._id.substring(0, 8) + '...' : 'N/A'}</div>
                    </div>
                </div>
            </td>
            <td class="px-6 py-4 text-gray-300">${user.email || 'N/A'}</td>
            <td class="px-6 py-4">${roleBadge}</td>
            <td class="px-6 py-4 text-gray-400">${joinDate}</td>
            <td class="px-6 py-4">
                <div class="flex space-x-2">
                    <button onclick="promoteUser('${user._id}')" class="bg-yellow-600 hover:bg-yellow-700 px-3 py-2 rounded text-sm transition-colors flex items-center space-x-1">
                        <i class="fas fa-sync-alt text-xs"></i>
                        <span>${user.role === 'admin' ? 'Demote' : 'Promote'}</span>
                    </button>
                    <button onclick="deleteUser('${user._id}', '${user.username || 'user'}')" class="bg-red-600 hover:bg-red-700 px-3 py-2 rounded text-sm transition-colors flex items-center space-x-1">
                        <i class="fas fa-trash text-xs"></i>
                        <span>Delete</span>
                    </button>
                </div>
            </td>
        `;
        
        tbody.appendChild(row);
    });
    
    console.log(`✅ Displayed ${users.length} users`);
}

// Update statistics
function updateStats(users) {
    if (!users || !Array.isArray(users)) {
        console.error('❌ Invalid users data for stats:', users);
        return;
    }
    
    const totalUsers = users.length;
    const adminUsers = users.filter(u => u.role === 'admin').length;
    const regularUsers = totalUsers - adminUsers;
    
    // Calculate today's users
    const today = new Date().toDateString();
    const todayUsers = users.filter(u => {
        const userDate = u.createdAt ? new Date(u.createdAt).toDateString() : new Date().toDateString();
        return userDate === today;
    }).length;

    // Update DOM elements
    const totalEl = document.getElementById('total-users');
    const adminEl = document.getElementById('admin-users');
    const regularEl = document.getElementById('regular-users');
    const todayEl = document.getElementById('today-users');
    
    if (totalEl) totalEl.textContent = totalUsers;
    if (adminEl) adminEl.textContent = adminUsers;
    if (regularEl) regularEl.textContent = regularUsers;
    if (todayEl) todayEl.textContent = todayUsers;
    
    console.log(`📊 Stats updated: Total: ${totalUsers}, Admins: ${adminUsers}, Regular: ${regularUsers}, Today: ${todayUsers}`);
}

// Initialize admin dashboard
document.addEventListener('DOMContentLoaded', function() {
    console.log('🕷️ Admin dashboard initializing...');
    
    const auth = checkAdminAuth();
    if (!auth) return;

    // Update welcome message
    const welcomeElement = document.getElementById('admin-welcome');
    if (welcomeElement) {
        welcomeElement.textContent = `Welcome, ${auth.userData.username || 'Admin'}!`;
    }

    // Load users
    loadUsers();

    // Add user form handler
    const addUserForm = document.getElementById('add-user-form');
    if (addUserForm) {
        addUserForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userData = {
                username: document.getElementById('new-username').value.trim(),
                email: document.getElementById('new-email').value.trim(),
                password: document.getElementById('new-password').value,
                role: document.getElementById('new-role').value
            };

            // Validate form
            if (!userData.username || !userData.email || !userData.password) {
                showNotification('Please fill in all fields', 'error');
                return;
            }

            if (userData.password.length < 6) {
                showNotification('Password must be at least 6 characters', 'error');
                return;
            }

            addUser(userData);
        });
    }

    console.log('✅ Spider-Admin dashboard initialized!');
});

// ========== UTILITY FUNCTIONS ==========

function showAddUserModal() {
    const modal = document.getElementById('addUserModal');
    if (modal) {
        modal.style.display = 'block';
    }
}

function closeAddUserModal() {
    const modal = document.getElementById('addUserModal');
    if (modal) {
        modal.style.display = 'none';
        // Reset form
        const form = document.getElementById('add-user-form');
        if (form) form.reset();
    }
}

function refreshUsers() {
    loadUsers();
    showNotification('Refreshing user list...', 'info');
}

function switchToUserDashboard() {
    window.location.href = '/dashboard.html';
}

function logout() {
    localStorage.removeItem('user');
    localStorage.removeItem('token');
    window.location.href = '/';
}

function showLoading(show) {
    const loadingState = document.getElementById('loading-state');
    const usersTable = document.querySelector('.admin-card');
    
    if (loadingState && usersTable) {
        if (show) {
            loadingState.classList.remove('hidden');
            usersTable.classList.add('hidden');
        } else {
            loadingState.classList.add('hidden');
            usersTable.classList.remove('hidden');
        }
    }
}

function showNotification(message, type = 'info') {
    // Remove existing notifications
    const existingNotifications = document.querySelectorAll('.custom-notification');
    existingNotifications.forEach(notif => notif.remove());
    
    // Create notification element
    const notification = document.createElement('div');
    notification.className = `custom-notification fixed top-4 right-4 p-4 rounded-lg z-50 transform transition-all duration-300 ${
        type === 'success' ? 'bg-green-600 border border-green-400' : 
        type === 'error' ? 'bg-red-600 border border-red-400' : 
        'bg-blue-600 border border-blue-400'
    } text-white shadow-lg`;
    notification.innerHTML = `
        <div class="flex items-center space-x-3">
            <i class="fas fa-${type === 'success' ? 'check' : type === 'error' ? 'exclamation-triangle' : 'info'}"></i>
            <span>${message}</span>
        </div>
    `;
    
    document.body.appendChild(notification);
    
    // Animate in
    setTimeout(() => {
        notification.style.transform = 'translateX(0)';
    }, 10);
    
    // Remove after 4 seconds
    setTimeout(() => {
        notification.style.transform = 'translateX(100%)';
        setTimeout(() => {
            if (notification.parentNode) {
                notification.remove();
            }
        }, 300);
    }, 4000);
}

// Make functions global
window.promoteUser = promoteUser;
window.deleteUser = deleteUser;
window.showAddUserModal = showAddUserModal;
window.closeAddUserModal = closeAddUserModal;
window.refreshUsers = refreshUsers;
window.switchToUserDashboard = switchToUserDashboard;
window.logout = logout;
    </script>
</body>
</html>
