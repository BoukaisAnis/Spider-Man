<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spider-Man | Orders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="https://i.pinimg.com/1200x/bc/ae/a4/bcaea48932509f7d4813b0d3636cee7d.jpg"
    />

    <style>
      body {
        font-family: "Roboto", sans-serif;
        background: linear-gradient(
          135deg,
          #0a0a0a 0%,
          #1a1a2e 50%,
          #16213e 100%
        );
        color: white;
        min-height: 100vh;
      }
      .hero-title {
        font-family: "Orbitron", sans-serif;
      }
      .orders-card {
        background: rgba(20, 20, 20, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(229, 9, 20, 0.3);
      }
      .order-item {
        background: rgba(30, 30, 30, 0.6);
        border: 1px solid rgba(229, 9, 20, 0.2);
        transition: all 0.3s ease;
      }
      .order-item:hover {
        border-color: rgba(229, 9, 20, 0.5);
        box-shadow: 0 5px 15px rgba(229, 9, 20, 0.2);
      }
      .status-badge {
        display: inline-block;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        font-size: 0.875rem;
        font-weight: 600;
      }
      .status-pending {
        background: rgba(234, 179, 8, 0.2);
        color: #eab308;
        border: 1px solid rgba(234, 179, 8, 0.5);
      }
      .status-processing {
        background: rgba(59, 130, 246, 0.2);
        color: #3b82f6;
        border: 1px solid rgba(59, 130, 246, 0.5);
      }
      .status-shipped {
        background: rgba(168, 85, 247, 0.2);
        color: #a855f7;
        border: 1px solid rgba(168, 85, 247, 0.5);
      }
      .status-delivered {
        background: rgba(34, 197, 94, 0.2);
        color: #22c55e;
        border: 1px solid rgba(34, 197, 94, 0.5);
      }
      .status-cancelled {
        background: rgba(239, 68, 68, 0.2);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.5);
      }
      .btn-primary {
        background: #e50914;
        transition: all 0.3s ease;
      }
      .btn-primary:hover {
        background: #c20812;
        box-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
      }
      .btn-secondary {
        background: rgba(229, 9, 20, 0.1);
        border: 1px solid rgba(229, 9, 20, 0.3);
        transition: all 0.3s ease;
      }
      .btn-secondary:hover {
        background: rgba(229, 9, 20, 0.2);
        border-color: rgba(229, 9, 20, 0.6);
      }
      .filter-btn {
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        border: 1px solid rgba(229, 9, 20, 0.3);
        background: transparent;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .filter-btn.active {
        background: #e50914;
        border-color: #e50914;
      }
      .filter-btn:hover {
        border-color: #e50914;
      }
      .progress-timeline {
        display: flex;
        gap: 1rem;
        margin: 1.5rem 0;
      }
      .timeline-step {
        flex: 1;
        text-align: center;
        position: relative;
      }
      .timeline-step::after {
        content: "";
        position: absolute;
        top: 20px;
        left: 50%;
        width: 100%;
        height: 2px;
        background: rgba(229, 9, 20, 0.2);
        z-index: -1;
      }
      .timeline-step:last-child::after {
        display: none;
      }
      .timeline-step.completed::after {
        background: #22c55e;
      }
      .timeline-dot {
        width: 40px;
        height: 40px;
        background: rgba(229, 9, 20, 0.2);
        border: 2px solid rgba(229, 9, 20, 0.3);
        border-radius: 50%;
        margin: 0 auto 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
      }
      .timeline-step.completed .timeline-dot {
        background: #22c55e;
        border-color: #22c55e;
      }
      .timeline-label {
        font-size: 0.75rem;
        color: #999;
        margin-top: 0.5rem;
      }
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 1000;
        align-items: center;
        justify-content: center;
      }
      .modal.active {
        display: flex;
      }
      .modal-content {
        background: rgba(20, 20, 20, 0.95);
        border: 1px solid rgba(229, 9, 20, 0.3);
        border-radius: 0.5rem;
        padding: 2rem;
        max-width: 600px;
        width: 90%;
        max-height: 90vh;
        overflow-y: auto;
      }
    </style>
  </head>
  <body class="min-h-screen">
    <!-- Navigation -->
    <nav class="bg-gray-800 border-b border-gray-700 p-4">
      <div class="container mx-auto flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <img
            src="https://i.pinimg.com/1200x/bc/ae/a4/bcaea48932509f7d4813b0d3636cee7d.jpg"
            alt="Spider-Man"
            class="w-10 h-10 rounded-full border-2 border-red-600"
          />
          <span class="hero-title text-xl font-bold">Spider-Shop</span>
        </div>
        <div class="flex items-center space-x-4">
          <a
            href="/dashboard.html"
            class="hover:text-red-500 transition-colors"
          >
            <i class="fas fa-tachometer-alt mr-2"></i>Dashboard
          </a>
          <a href="/shop.html" class="hover:text-red-500 transition-colors">
            <i class="fas fa-store mr-2"></i>Shop
          </a>
          <a href="/cart.html" class="hover:text-red-500 transition-colors">
            <i class="fas fa-shopping-cart mr-2"></i>Cart
          </a>
          <a href="/orders.html" class="text-red-500">
            <i class="fas fa-box mr-2"></i>Orders
          </a>
          <a href="/profile.html" class="hover:text-red-500 transition-colors">
            <i class="fas fa-user mr-2"></i>Profile
          </a>
          <button
            onclick="logout()"
            class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded transition-colors"
          >
            <i class="fas fa-sign-out-alt mr-2"></i>Logout
          </button>
        </div>
      </div>
    </nav>

    <!-- Orders Content -->
    <div class="container mx-auto px-4 py-8">
      <h1 class="text-4xl font-bold text-center mb-2 hero-title">
        YOUR <span class="text-red-500">ORDERS</span>
      </h1>
      <p class="text-gray-400 text-center mb-8">
        Track and manage all your orders
      </p>

      <div class="orders-card rounded-lg p-6">
        <!-- Filter Section -->
        <div class="mb-6 pb-6 border-b border-gray-700">
          <h3 class="text-lg font-bold mb-4">Filter Orders</h3>
          <div class="flex flex-wrap gap-2">
            <button class="filter-btn active" onclick="filterOrders('all')">
              <i class="fas fa-list mr-2"></i>All Orders
            </button>
            <button class="filter-btn" onclick="filterOrders('pending')">
              <i class="fas fa-clock mr-2"></i>Pending
            </button>
            <button class="filter-btn" onclick="filterOrders('processing')">
              <i class="fas fa-spinner mr-2"></i>Processing
            </button>
            <button class="filter-btn" onclick="filterOrders('shipped')">
              <i class="fas fa-truck mr-2"></i>Shipped
            </button>
            <button class="filter-btn" onclick="filterOrders('delivered')">
              <i class="fas fa-check-circle mr-2"></i>Delivered
            </button>
            <button class="filter-btn" onclick="filterOrders('cancelled')">
              <i class="fas fa-ban mr-2"></i>Cancelled
            </button>
          </div>
        </div>

        <!-- Orders List -->
        <div id="ordersList" class="space-y-4">
          <!-- Loading State -->
          <div id="loadingState" class="text-center py-12">
            <i class="fas fa-spinner fa-spin text-3xl text-red-600 mb-4"></i>
            <p class="text-gray-400">Loading your orders...</p>
          </div>

          <!-- Empty State -->
          <div id="emptyState" class="text-center py-12 hidden">
            <i class="fas fa-inbox text-4xl text-gray-600 mb-4"></i>
            <h3 class="text-xl font-bold text-gray-400 mb-2">No orders yet</h3>
            <p class="text-gray-500 mb-6">
              Start shopping for some amazing Spider-Man merchandise!
            </p>
            <a
              href="/shop.html"
              class="btn-primary text-white px-6 py-3 rounded-lg inline-block"
            >
              <i class="fas fa-store mr-2"></i>Start Shopping
            </a>
          </div>

          <!-- Orders Container -->
          <div id="ordersContainer"></div>
        </div>
      </div>
    </div>

    <!-- Order Details Modal -->
    <div id="orderModal" class="modal">
      <div class="modal-content">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-2xl font-bold">Order Details</h2>
          <button onclick="closeModal()" class="text-gray-400 hover:text-white">
            <i class="fas fa-times text-2xl"></i>
          </button>
        </div>

        <div id="modalContent">
          <!-- Content will be populated dynamically -->
        </div>
      </div>
    </div>

    <script>
      const API_BASE_URL = "/api/v1";
      let allOrders = [];
      let currentFilter = "all";

      // Check authentication
      function checkAuth() {
        const user = localStorage.getItem("user");
        const token = localStorage.getItem("token");

        if (!user || !token) {
          window.location.href = "/";
          return null;
        }

        try {
          const userData = JSON.parse(user);
          return { userData, token };
        } catch (error) {
          console.error("Error parsing user data:", error);
          logout();
          return null;
        }
      }

      // Load orders
      async function loadOrders() {
        const auth = checkAuth();
        if (!auth) return;

        try {
          showLoading(true);

          const response = await fetch(`${API_BASE_URL}/cart`, {
            headers: {
              "x-auth-token": auth.token,
            },
          });

          const data = await response.json();

          if (data.success) {
            // For demo purposes, create sample orders
            allOrders = generateSampleOrders();
            displayOrders(allOrders);
          } else {
            showEmpty();
          }
        } catch (error) {
          console.error("Error loading orders:", error);
          showEmpty();
        } finally {
          showLoading(false);
        }
      }

      // Generate sample orders for demo
      function generateSampleOrders() {
        return [
          {
            id: "#ORD-001",
            date: "2025-11-20",
            total: 149.99,
            status: "delivered",
            items: [
              { name: "Spider-Man Hoodie", price: 79.99, quantity: 1 },
              { name: "Spider-Web Backpack", price: 70.0, quantity: 1 },
            ],
            tracking: "SPDR123456789",
            timeline: ["pending", "processing", "shipped", "delivered"],
          },
          {
            id: "#ORD-002",
            date: "2025-11-18",
            total: 89.99,
            status: "shipped",
            items: [{ name: "Spider-Man T-Shirt", price: 29.99, quantity: 3 }],
            tracking: "SPDR987654321",
            timeline: ["pending", "processing", "shipped"],
          },
          {
            id: "#ORD-003",
            date: "2025-11-15",
            total: 199.99,
            status: "processing",
            items: [
              { name: "Spider-Man Figure", price: 49.99, quantity: 1 },
              { name: "Spider-Man Poster", price: 19.99, quantity: 5 },
            ],
            tracking: "SPDR555666777",
            timeline: ["pending", "processing"],
          },
          {
            id: "#ORD-004",
            date: "2025-11-10",
            total: 59.99,
            status: "pending",
            items: [{ name: "Spider-Man Cap", price: 29.99, quantity: 2 }],
            tracking: "SPDR111222333",
            timeline: ["pending"],
          },
        ];
      }

      // Display orders
      function displayOrders(orders) {
        const container = document.getElementById("ordersContainer");
        const emptyState = document.getElementById("emptyState");

        if (orders.length === 0) {
          container.innerHTML = "";
          emptyState.classList.remove("hidden");
          return;
        }

        emptyState.classList.add("hidden");

        container.innerHTML = orders
          .map(
            (order) => `
                <div class="order-item rounded-lg p-6">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-lg font-bold">${order.id}</h3>
                            <p class="text-sm text-gray-400">Ordered on ${new Date(
                              order.date
                            ).toLocaleDateString()}</p>
                        </div>
                        <div class="text-right">
                            <span class="status-badge status-${order.status}">
                                <i class="fas fa-${getStatusIcon(
                                  order.status
                                )} mr-1"></i>
                                ${
                                  order.status.charAt(0).toUpperCase() +
                                  order.status.slice(1)
                                }
                            </span>
                            <p class="text-xl font-bold text-red-500 mt-2">$${order.total.toFixed(
                              2
                            )}</p>
                        </div>
                    </div>

                    <div class="mb-4 pb-4 border-b border-gray-700">
                        <p class="text-sm text-gray-400 mb-2">Items: ${
                          order.items.length
                        }</p>
                        <div class="text-sm text-gray-300">
                            ${order.items
                              .map(
                                (item) => `
                                <div class="flex justify-between">
                                    <span>${item.name} (x${
                                  item.quantity
                                })</span>
                                    <span>$${(
                                      item.price * item.quantity
                                    ).toFixed(2)}</span>
                                </div>
                            `
                              )
                              .join("")}
                        </div>
                    </div>

                    <div class="mb-4">
                        <p class="text-sm text-gray-400 mb-2">Tracking: <span class="text-gray-300">${
                          order.tracking
                        }</span></p>
                    </div>

                    <div class="flex gap-2">
                        <button onclick="showOrderDetails('${
                          order.id
                        }')" class="btn-secondary text-white px-4 py-2 rounded-lg text-sm">
                            <i class="fas fa-info-circle mr-2"></i>View Details
                        </button>
                        <button onclick="trackOrder('${
                          order.tracking
                        }')" class="btn-secondary text-white px-4 py-2 rounded-lg text-sm">
                            <i class="fas fa-map-marker-alt mr-2"></i>Track Package
                        </button>
                        ${
                          order.status === "delivered"
                            ? `
                            <button onclick="reorderItems('${order.id}')" class="btn-secondary text-white px-4 py-2 rounded-lg text-sm">
                                <i class="fas fa-redo mr-2"></i>Reorder
                            </button>
                        `
                            : ""
                        }
                    </div>
                </div>
            `
          )
          .join("");
      }

      // Get status icon
      function getStatusIcon(status) {
        const icons = {
          pending: "hourglass-start",
          processing: "cogs",
          shipped: "truck",
          delivered: "check-circle",
          cancelled: "times-circle",
        };
        return icons[status] || "box";
      }

      // Filter orders
      function filterOrders(filter) {
        currentFilter = filter;

        // Update filter buttons
        document.querySelectorAll(".filter-btn").forEach((btn) => {
          btn.classList.remove("active");
        });
        event.target.closest(".filter-btn").classList.add("active");

        // Filter and display
        const filtered =
          filter === "all"
            ? allOrders
            : allOrders.filter((order) => order.status === filter);

        displayOrders(filtered);
      }

      // Show order details
      function showOrderDetails(orderId) {
        const order = allOrders.find((o) => o.id === orderId);
        if (!order) return;

        const modalContent = document.getElementById("modalContent");
        const currentStep = order.timeline.length;

        modalContent.innerHTML = `
                <div class="space-y-6">
                    <div>
                        <p class="text-gray-400">Order ID: <span class="text-white font-bold">${
                          order.id
                        }</span></p>
                        <p class="text-gray-400">Tracking: <span class="text-white font-bold">${
                          order.tracking
                        }</span></p>
                        <p class="text-gray-400">Order Date: <span class="text-white font-bold">${new Date(
                          order.date
                        ).toLocaleDateString()}</span></p>
                    </div>

                    <div>
                        <h3 class="font-bold mb-3">Order Timeline</h3>
                        <div class="progress-timeline">
                            <div class="timeline-step ${
                              currentStep > 0 ? "completed" : ""
                            }">
                                <div class="timeline-dot"><i class="fas fa-list"></i></div>
                                <div class="timeline-label">Pending</div>
                            </div>
                            <div class="timeline-step ${
                              currentStep > 1 ? "completed" : ""
                            }">
                                <div class="timeline-dot"><i class="fas fa-cogs"></i></div>
                                <div class="timeline-label">Processing</div>
                            </div>
                            <div class="timeline-step ${
                              currentStep > 2 ? "completed" : ""
                            }">
                                <div class="timeline-dot"><i class="fas fa-truck"></i></div>
                                <div class="timeline-label">Shipped</div>
                            </div>
                            <div class="timeline-step ${
                              currentStep > 3 ? "completed" : ""
                            }">
                                <div class="timeline-dot"><i class="fas fa-check"></i></div>
                                <div class="timeline-label">Delivered</div>
                            </div>
                        </div>
                    </div>

                    <div>
                        <h3 class="font-bold mb-3">Items</h3>
                        <div class="space-y-2">
                            ${order.items
                              .map(
                                (item) => `
                                <div class="flex justify-between p-2 bg-gray-800 rounded">
                                    <span>${item.name} (x${
                                  item.quantity
                                })</span>
                                    <span class="text-red-500">$${(
                                      item.price * item.quantity
                                    ).toFixed(2)}</span>
                                </div>
                            `
                              )
                              .join("")}
                        </div>
                    </div>

                    <div class="border-t border-gray-700 pt-4">
                        <div class="flex justify-between text-lg font-bold">
                            <span>Total</span>
                            <span class="text-red-500">$${order.total.toFixed(
                              2
                            )}</span>
                        </div>
                    </div>
                </div>
            `;

        document.getElementById("orderModal").classList.add("active");
      }

      // Track order
      function trackOrder(tracking) {
        showNotification(
          `Tracking ${tracking}: Package is on the way!`,
          "info"
        );
      }

      // Reorder items
      function reorderItems(orderId) {
        const order = allOrders.find((o) => o.id === orderId);
        if (!order) return;

        showNotification(
          `Added ${order.items.length} items to cart`,
          "success"
        );
        setTimeout(() => {
          window.location.href = "/cart.html";
        }, 1500);
      }

      // Close modal
      function closeModal() {
        document.getElementById("orderModal").classList.remove("active");
      }

      // Show/hide loading
      function showLoading(show) {
        const loading = document.getElementById("loadingState");
        if (show) {
          loading.classList.remove("hidden");
        } else {
          loading.classList.add("hidden");
        }
      }

      // Show empty state
      function showEmpty() {
        document.getElementById("emptyState").classList.remove("hidden");
        document.getElementById("ordersContainer").innerHTML = "";
      }

      // Logout
      function logout() {
        if (confirm("Are you sure you want to logout?")) {
          localStorage.removeItem("user");
          localStorage.removeItem("token");
          window.location.href = "/";
        }
      }

      // Show notification
      function showNotification(message, type = "info") {
        const notification = document.createElement("div");
        const bgColor =
          type === "error"
            ? "bg-red-600"
            : type === "success"
            ? "bg-green-600"
            : "bg-blue-600";

        notification.className = `fixed top-4 right-4 ${bgColor} text-white px-6 py-3 rounded-lg shadow-lg z-50`;
        notification.innerHTML = `
                <div class="flex items-center space-x-2">
                    <i class="fas fa-${
                      type === "error"
                        ? "exclamation-circle"
                        : type === "success"
                        ? "check-circle"
                        : "info-circle"
                    }"></i>
                    <span>${message}</span>
                </div>
            `;

        document.body.appendChild(notification);

        setTimeout(() => {
          notification.remove();
        }, 3000);
      }

      // Close modal when clicking outside
      window.onclick = function (event) {
        const modal = document.getElementById("orderModal");
        if (event.target === modal) {
          modal.classList.remove("active");
        }
      };

      // Initialize page
      document.addEventListener("DOMContentLoaded", function () {
        loadOrders();
      });
    </script>
  </body>
</html>
