<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spider-Man | Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="https://i.pinimg.com/1200x/bc/ae/a4/bcaea48932509f7d4813b0d3636cee7d.jpg"
    />

    <style>
      body {
        font-family: "Roboto", sans-serif;
        background: linear-gradient(
          135deg,
          #0a0a0a 0%,
          #1a1a2e 50%,
          #16213e 100%
        );
        color: white;
        min-height: 100vh;
      }
      .hero-title {
        font-family: "Orbitron", sans-serif;
      }
      .spidey-glow {
        box-shadow: 0 0 30px rgba(229, 9, 20, 0.6);
      }
      .text-glow {
        text-shadow: 0 0 10px rgba(229, 9, 20, 0.7);
      }
      .web-background {
        background: linear-gradient(
          135deg,
          #0a0a0a 0%,
          #1a1a2e 50%,
          #16213e 100%
        );
      }
      .product-card {
        background: rgba(20, 20, 20, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(229, 9, 20, 0.3);
        transition: all 0.3s ease;
      }
      .product-card:hover {
        transform: translateY(-5px);
        border-color: rgba(229, 9, 20, 0.6);
        box-shadow: 0 10px 25px rgba(229, 9, 20, 0.2);
      }
      .filter-card {
        background: rgba(20, 20, 20, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(229, 9, 20, 0.3);
      }
    </style>
  </head>
  <body class="web-background min-h-screen">
    <!-- Navigation -->
    <nav class="bg-gray-800 border-b border-gray-700 p-4">
      <div class="container mx-auto flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <img
            src="https://i.pinimg.com/1200x/bc/ae/a4/bcaea48932509f7d4813b0d3636cee7d.jpg"
            alt="Spider-Man"
            class="w-10 h-10 rounded-full border-2 border-red-600"
          />
          <span class="hero-title text-xl font-bold">Spider-Shop</span>
        </div>
        <div class="flex items-center space-x-4">
          <a
            href="/dashboard.html"
            class="hover:text-red-500 transition-colors"
          >
            <i class="fas fa-tachometer-alt mr-2"></i>Dashboard
          </a>
          <a href="/shop.html" class="text-red-500">
            <i class="fas fa-store mr-2"></i>Shop
          </a>
          <a
            href="/cart.html"
            class="hover:text-red-500 transition-colors relative"
          >
            <i class="fas fa-shopping-cart mr-2"></i>Cart
            <span
              id="cart-badge"
              class="absolute -top-2 -right-2 bg-red-600 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center hidden"
              >0</span
            >
          </a>
          <button
            onclick="logout()"
            class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded transition-colors"
          >
            <i class="fas fa-sign-out-alt mr-2"></i>Logout
          </button>
        </div>
      </div>
    </nav>

    <!-- Shop Content -->
    <div class="container mx-auto px-4 py-8">
      <h1 class="text-4xl font-bold text-center mb-2 hero-title">
        <span class="text-glow">SPIDER-MAN</span> MERCHANDISE
      </h1>
      <p class="text-gray-400 text-center mb-8">
        Your friendly neighborhood store
      </p>

      <!-- Filters -->
      <div class="filter-card p-6 rounded-lg mb-8">
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
          <div>
            <label class="block text-sm font-medium mb-2">Category</label>
            <select
              id="categoryFilter"
              class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:border-red-500 focus:ring-1 focus:ring-red-500"
            >
              <option value="">All Categories</option>
              <option value="electronics">Electronics</option>
              <option value="clothing">Clothing</option>
              <option value="toys">Toys</option>
              <option value="home">Home</option>
              <option value="sports">Sports</option>
              <option value="books">Books</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">Min Price</label>
            <input
              type="number"
              id="minPrice"
              placeholder="Min"
              class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:border-red-500 focus:ring-1 focus:ring-red-500"
            />
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">Max Price</label>
            <input
              type="number"
              id="maxPrice"
              placeholder="Max"
              class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:border-red-500 focus:ring-1 focus:ring-red-500"
            />
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">Sort By</label>
            <select
              id="sortBy"
              class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:border-red-500 focus:ring-1 focus:ring-red-500"
            >
              <option value="createdAt">Newest</option>
              <option value="price">Price: Low to High</option>
              <option value="-price">Price: High to Low</option>
              <option value="name">Name A-Z</option>
            </select>
          </div>
          <div class="flex items-end">
            <button
              onclick="applyFilters()"
              class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded w-full transition-colors"
            >
              <i class="fas fa-filter mr-2"></i>Apply Filters
            </button>
          </div>
        </div>
      </div>

      <!-- Products Grid -->
      <div
        id="productsGrid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mb-8"
      >
        <!-- Products will be loaded here -->
      </div>

      <!-- Loading State -->
      <div id="loadingState" class="text-center py-12">
        <i class="fas fa-spinner fa-spin text-3xl text-red-600 mb-4"></i>
        <p class="text-gray-400">Loading amazing products...</p>
      </div>

      <!-- Admin Panel -->
      <div id="adminPanel" class="mt-12 hidden">
        <div class="border-t border-gray-700 pt-8">
          <h2 class="text-2xl font-bold mb-4 flex items-center">
            <i class="fas fa-shield-alt text-yellow-500 mr-2"></i>
            Admin Panel
          </h2>
          <button
            onclick="showAddProductModal()"
            class="bg-green-600 hover:bg-green-700 px-6 py-3 rounded-lg transition-colors mb-6"
          >
            <i class="fas fa-plus mr-2"></i>Add New Product
          </button>
        </div>
      </div>
    </div>

    <!-- Add Product Modal -->
    <div
      id="addProductModal"
      class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4"
    >
      <div
        class="bg-gray-800 p-6 rounded-lg w-full max-w-md max-h-[90vh] overflow-y-auto"
      >
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xl font-bold">Add New Product</h3>
          <button
            onclick="closeAddProductModal()"
            class="text-gray-400 hover:text-white"
          >
            <i class="fas fa-times text-xl"></i>
          </button>
        </div>
        <form id="addProductForm" class="space-y-4">
          <div>
            <label class="block text-gray-300 mb-2">Product Name</label>
            <input
              type="text"
              id="productName"
              class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:border-red-500 focus:ring-1 focus:ring-red-500"
              required
            />
          </div>
          <div>
            <label class="block text-gray-300 mb-2">Description</label>
            <textarea
              id="productDescription"
              rows="3"
              class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:border-red-500 focus:ring-1 focus:ring-red-500"
              required
            ></textarea>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-gray-300 mb-2">Price ($)</label>
              <input
                type="number"
                id="productPrice"
                step="0.01"
                class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:border-red-500 focus:ring-1 focus:ring-red-500"
                required
              />
            </div>
            <div>
              <label class="block text-gray-300 mb-2">Stock</label>
              <input
                type="number"
                id="productStock"
                class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:border-red-500 focus:ring-1 focus:ring-red-500"
                required
              />
            </div>
          </div>
          <div>
            <label class="block text-gray-300 mb-2">Category</label>
            <select
              id="productCategory"
              class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:border-red-500 focus:ring-1 focus:ring-red-500"
              required
            >
              <option value="">Select Category</option>
              <option value="electronics">Electronics</option>
              <option value="clothing">Clothing</option>
              <option value="toys">Toys</option>
              <option value="home">Home</option>
              <option value="sports">Sports</option>
              <option value="books">Books</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-300 mb-2">Image URL</label>
            <input
              type="url"
              id="productImage"
              class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:border-red-500 focus:ring-1 focus:ring-red-500"
              placeholder="https://example.com/image.jpg"
            />
          </div>
          <div class="flex space-x-4 pt-4">
            <button
              type="button"
              onclick="closeAddProductModal()"
              class="flex-1 bg-gray-600 hover:bg-gray-700 py-3 rounded transition-colors"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="flex-1 bg-red-600 hover:bg-red-700 py-3 rounded transition-colors"
            >
              Add Product
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const API_BASE_URL = "/api/v1";

      // Check authentication
      function checkAuth() {
        const user = localStorage.getItem("user");
        const token = localStorage.getItem("token");

        if (!user || !token) {
          window.location.href = "/";
          return null;
        }

        try {
          const userData = JSON.parse(user);
          return { userData, token };
        } catch (error) {
          console.error("Error parsing user data:", error);
          logout();
          return null;
        }
      }

      // Load products
      async function loadProducts(filters = {}) {
        const auth = checkAuth();
        if (!auth) return;

        try {
          showLoading(true);

          const queryParams = new URLSearchParams(filters).toString();
          const response = await fetch(
            `${API_BASE_URL}/products?${queryParams}`,
            {
              headers: {
                "x-auth-token": auth.token,
              },
            }
          );

          const data = await response.json();

          if (data.success) {
            displayProducts(data.products);

            // Show admin panel if user is admin
            if (auth.userData.role === "admin") {
              document.getElementById("adminPanel").classList.remove("hidden");
            }
          }
        } catch (error) {
          console.error("Error loading products:", error);
          showNotification("Error loading products", "error");
        } finally {
          showLoading(false);
        }
      }

      // Display products
      function displayProducts(products) {
        const grid = document.getElementById("productsGrid");

        if (products.length === 0) {
          grid.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <i class="fas fa-search text-4xl text-gray-600 mb-4"></i>
                        <h3 class="text-xl font-bold text-gray-400 mb-2">No products found</h3>
                        <p class="text-gray-500">Try adjusting your filters</p>
                    </div>
                `;
          return;
        }

        grid.innerHTML = products
          .map(
            (product) => `
                <div class="product-card rounded-lg overflow-hidden max-w-xs">
                    <div class="relative">
                        <img src="${product.image}" alt="${product.name}" 
                             class="w-64 h-48 object-cover" 
                             onerror="this.src='https://via.placeholder.com/300x300?text=No+Image'">
                        ${
                          product.stock === 0
                            ? `
                            <div class="absolute top-2 right-2 bg-gray-800 text-white px-2 py-1 rounded text-sm">
                                Out of Stock
                            </div>
                        `
                            : ""
                        }
                        ${
                          product.isNew
                            ? `
                            <div class="absolute top-2 left-2 bg-red-600 text-white px-2 py-1 rounded text-sm">
                                New
                            </div>
                        `
                            : ""
                        }
                    </div>
                    <div class="p-4">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-lg">${product.name}</h3>
                            <span class="bg-gray-700 text-xs px-2 py-1 rounded">${
                              product.category
                            }</span>
                        </div>
                        <p class="text-gray-400 text-sm mb-3 line-clamp-2">${
                          product.description
                        }</p>
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-red-500 font-bold text-xl">$${
                              product.price
                            }</span>
                            <span class="text-sm text-gray-400">Stock: ${
                              product.stock
                            }</span>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick="addToCart('${product._id}')" 
                                    class="flex-1 bg-red-600 hover:bg-red-700 py-2 rounded transition-colors flex items-center justify-center space-x-2"
                                    ${product.stock === 0 ? "disabled" : ""}>
                                <i class="fas fa-cart-plus"></i>
                                <span>${
                                  product.stock === 0
                                    ? "Out of Stock"
                                    : "Add to Cart"
                                }</span>
                            </button>
                            ${
                              checkAuth().userData.role === "admin"
                                ? `
                                <button onclick="editProduct('${product._id}')" class="bg-yellow-600 hover:bg-yellow-700 px-3 py-2 rounded transition-colors">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button onclick="deleteProduct('${product._id}')" class="bg-red-700 hover:bg-red-800 px-3 py-2 rounded transition-colors">
                                    <i class="fas fa-trash"></i>
                                </button>
                            `
                                : ""
                            }
                        </div>
                    </div>
                </div>
            `
          )
          .join("");
      }

      // Apply filters
      function applyFilters() {
        const filters = {
          category: document.getElementById("categoryFilter").value,
          minPrice: document.getElementById("minPrice").value,
          maxPrice: document.getElementById("maxPrice").value,
          sortBy: document.getElementById("sortBy").value,
        };

        // Remove empty filters
        Object.keys(filters).forEach((key) => {
          if (!filters[key]) delete filters[key];
        });

        loadProducts(filters);
      }

      // Add to cart
      async function addToCart(productId) {
        const auth = checkAuth();
        if (!auth) return;

        try {
          const response = await fetch(`${API_BASE_URL}/cart/add`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-auth-token": auth.token,
            },
            body: JSON.stringify({ productId, quantity: 1 }),
          });

          const data = await response.json();

          if (data.success) {
            showNotification("Product added to cart! 🛒", "success");
            updateCartBadge();
          } else {
            showNotification("Error: " + data.message, "error");
          }
        } catch (error) {
          console.error("Error adding to cart:", error);
          showNotification("Error adding product to cart", "error");
        }
      }

      // Update cart badge
      async function updateCartBadge() {
        const auth = checkAuth();
        if (!auth) return;

        try {
          const response = await fetch(`${API_BASE_URL}/cart`, {
            headers: {
              "x-auth-token": auth.token,
            },
          });

          if (response.ok) {
            const data = await response.json();
            if (data.success) {
              const itemCount = data.cart.items.reduce(
                (total, item) => total + item.quantity,
                0
              );
              const badge = document.getElementById("cart-badge");
              badge.textContent = itemCount;
              badge.classList.toggle("hidden", itemCount === 0);
            }
          }
        } catch (error) {
          console.error("Error updating cart badge:", error);
        }
      }

      // Admin functions
      function showAddProductModal() {
        document.getElementById("addProductModal").classList.remove("hidden");
      }

      function closeAddProductModal() {
        document.getElementById("addProductModal").classList.add("hidden");
        document.getElementById("addProductForm").reset();
      }

      // Add new product
      document
        .getElementById("addProductForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const auth = checkAuth();
          if (!auth || auth.userData.role !== "admin") return;

          const productData = {
            name: document.getElementById("productName").value,
            description: document.getElementById("productDescription").value,
            price: parseFloat(document.getElementById("productPrice").value),
            stock: parseInt(document.getElementById("productStock").value),
            category: document.getElementById("productCategory").value,
            image: document.getElementById("productImage").value || undefined,
          };

          try {
            const response = await fetch(`${API_BASE_URL}/products`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "x-auth-token": auth.token,
              },
              body: JSON.stringify(productData),
            });

            const data = await response.json();

            if (data.success) {
              showNotification("Product added successfully! 🎉", "success");
              closeAddProductModal();
              loadProducts();
            } else {
              showNotification("Error: " + data.message, "error");
            }
          } catch (error) {
            console.error("Error adding product:", error);
            showNotification("Error adding product", "error");
          }
        });

      // Show/hide loading
      function showLoading(show) {
        const loading = document.getElementById("loadingState");
        const grid = document.getElementById("productsGrid");

        if (show) {
          loading.classList.remove("hidden");
          grid.classList.add("hidden");
        } else {
          loading.classList.add("hidden");
          grid.classList.remove("hidden");
        }
      }

      // Show notification
      function showNotification(message, type = "info") {
        // Create notification element
        const notification = document.createElement("div");
        notification.className = `fixed top-4 right-4 p-4 rounded-lg z-50 transform transition-all duration-300 ${
          type === "success"
            ? "bg-green-600"
            : type === "error"
            ? "bg-red-600"
            : "bg-blue-600"
        } text-white shadow-lg`;
        notification.innerHTML = `
                <div class="flex items-center space-x-3">
                    <i class="fas fa-${
                      type === "success"
                        ? "check"
                        : type === "error"
                        ? "exclamation-triangle"
                        : "info"
                    }"></i>
                    <span>${message}</span>
                </div>
            `;

        document.body.appendChild(notification);

        // Remove after 3 seconds
        setTimeout(() => {
          notification.remove();
        }, 3000);
      }

      // Logout
      function logout() {
        localStorage.removeItem("user");
        localStorage.removeItem("token");
        window.location.href = "/";
      }

      // Initialize shop
      document.addEventListener("DOMContentLoaded", function () {
        checkAuth();
        loadProducts();
        updateCartBadge();
      });
    </script>
  </body>
</html>
